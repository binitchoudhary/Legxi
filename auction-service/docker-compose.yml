version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: legxi-auction-postgres-1
    environment:
      POSTGRES_USER: legxi_auction
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: auction_db
    volumes:
      - pg_auction_data:/var/lib/postgresql/data
    restart: unless-stopped
    ports: []
    networks:
      - auction-network

  auction-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legxi-auction-service-1
    environment:
      - DATABASE_URL=postgresql://legxi_auction:${DB_PASSWORD}@postgres:5432/auction_db?schema=public
      - PORT=4000
      - NODE_ENV=production
      - REDIS_URL=${REDIS_URL}
      - SHOPIFY_ADMIN_TOKEN=${SHOPIFY_ADMIN_TOKEN}
      - SHOPIFY_WEBHOOK_SECRET=${SHOPIFY_WEBHOOK_SECRET}
      - TRANSFER_SERVICE_TOKEN=${TRANSFER_SERVICE_TOKEN}
      - TRANSFER_SERVICE_URL=${TRANSFER_SERVICE_URL}
      - SHOPIFY_STORE=${SHOPIFY_STORE}
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - auction-network

volumes:
  pg_auction_data:

networks:
  auction-network:
    driver: bridge
